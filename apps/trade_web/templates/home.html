{% extends "base.html" %}
{% block title %}수출 데이터 · 품목{% endblock %}
{% block body %}
<div class="apphead">
  <span style="font-size:18px">🚢</span><span class="brand">수출 데이터</span>
  <span class="spacer"></span>
  <span class="badge" id="layerBadge">불러오는 중…</span>
</div>

<div class="toolbar">
  <div id="cats" style="display:flex;flex-wrap:wrap;gap:6px"></div>
  <span class="spacer" style="flex:1"></span>
  <input type="search" id="q" placeholder="품목 검색…" style="width:180px">
  <select id="sort">
    <option value="decade_yoy">동순 YoY순</option>
    <option value="month_yoy">월 YoY순</option>
    <option value="item">품목명순</option>
  </select>
</div>
<div class="caption" id="countLine" style="margin:0 0 10px"></div>
<div class="grid" id="grid"></div>

<script>
const CSS=getComputedStyle(document.documentElement), C=k=>CSS.getPropertyValue(k).trim();
const fmtAbbr=v=>v==null?"—":(Math.abs(v)>=1e9?"$"+(v/1e9).toFixed(1)+"B":Math.abs(v)>=1e6?"$"+(v/1e6).toFixed(1)+"M":Math.abs(v)>=1e3?"$"+(v/1e3).toFixed(1)+"K":"$"+v.toFixed(0));
const fmtPct=v=>v==null?"—":(v>=0?"+":"")+v.toFixed(1)+"%";
const pc=v=>v==null?C('--muted'):(v>=0?C('--up'):C('--down'));
let DATA=null, cat='전체';

function spark(cv, vals, color){           // 소형 canvas 스파크라인(경량 2D, 라이브러리 없음)
  const ctx=cv.getContext('2d'), w=cv.width=cv.clientWidth*2, h=cv.height=52;
  const ys=vals.filter(v=>v!=null); if(ys.length<2) return;
  const lo=Math.min(...ys), hi=Math.max(...ys), rng=(hi-lo)||1, step=w/(ys.length-1);
  ctx.clearRect(0,0,w,h); ctx.beginPath(); ctx.lineWidth=3; ctx.strokeStyle=color;
  ys.forEach((v,i)=>{const x=i*step, y=h-4-((v-lo)/rng)*(h-8); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.stroke();
}

function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const key=document.getElementById('sort').value;
  let list=DATA.items.filter(i=>(cat==='전체'||i.category===cat) && (!q||i.item.toLowerCase().includes(q)));
  list.sort(key==='item' ? (a,b)=>a.item.localeCompare(b.item)
    : (a,b)=>((b[key]??-1e9)-(a[key]??-1e9)));
  document.getElementById('countLine').textContent =
    `${list.length}개 품목 · 카드 클릭 시 상세 (기업별 데이터 보유 ${DATA.company_item_count}품목)`;
  const g=document.getElementById('grid');
  g.innerHTML=list.map(i=>`
    <a class="icard" href="/item/${encodeURIComponent(i.item)}">
      <div class="name">${i.item}${i.has_company?'<span class="cbadge">기업별</span>':''}</div>
      <div class="cat">${i.category}</div>
      <div class="row"><span class="k">${i.decade_label} 누계</span>
        <span><span class="amt">${fmtAbbr(i.decade_cum)}</span>
        <span style="color:${pc(i.decade_yoy)};font-weight:700;margin-left:6px">${fmtPct(i.decade_yoy)}</span></span></div>
      <div class="row"><span class="k">월간 ${i.month_period}</span>
        <span>${fmtAbbr(i.month_amount)}
        <span style="color:${pc(i.month_yoy)};font-weight:600;margin-left:6px">${fmtPct(i.month_yoy)}</span></span></div>
      <canvas class="sp" data-item="${encodeURIComponent(i.item)}" style="width:100%;height:26px;margin-top:8px"></canvas>
    </a>`).join('');
  const byName=Object.fromEntries(list.map(i=>[i.item,i]));
  g.querySelectorAll('canvas.sp').forEach(cv=>{
    const it=byName[decodeURIComponent(cv.dataset.item)];
    spark(cv, it.spark, pc(it.decade_yoy));
  });
}

fetch('/api/items').then(r=>r.json()).then(d=>{
  DATA=d;
  document.getElementById('layerBadge').innerHTML =
    `순별(10일 단위) 최신 <b style="color:var(--text)">${d.decade_latest}</b> · 월간 최신 <b style="color:var(--text)">${d.month_latest}</b>`;
  const cats=['전체',...d.categories];
  document.getElementById('cats').innerHTML=cats.map(c=>
    `<button class="pill${c==='전체'?' on':''}" data-c="${c}">${c}</button>`).join('');
  document.getElementById('cats').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    cat=b.dataset.c; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); render();
  });
  ['q','sort'].forEach(id=>document.getElementById(id).addEventListener('input',render));
  render();
});
</script>
{% endblock %}
