{% extends "base.html" %}
{% block title %}Watchlist{% endblock %}
{% block body %}
<div class="top"><h1>⭐ Watchlist</h1></div>
<div class="meta" id="wcount">불러오는 중…</div>
<div class="grid" id="grid"></div>
<div class="card" id="empty" style="display:none">
  Watchlist가 비어 있습니다. <a href="/">홈</a>이나 <a href="/signal">시그널</a>에서 ☆를 눌러 추가하세요.
</div>
<script>
const CSS=getComputedStyle(document.documentElement), C=k=>CSS.getPropertyValue(k).trim();
const fmtAbbr=v=>v==null?"—":(Math.abs(v)>=1e9?"$"+(v/1e9).toFixed(1)+"B":Math.abs(v)>=1e6?"$"+(v/1e6).toFixed(1)+"M":Math.abs(v)>=1e3?"$"+(v/1e3).toFixed(1)+"K":"$"+v.toFixed(0));
const fmtPct=v=>v==null?"—":(v>=0?"+":"")+v.toFixed(1)+"%";
const pc=v=>v==null?C('--muted'):(v>=0?C('--up'):C('--down'));
function spark(cv,vals,color){const ctx=cv.getContext('2d'),w=cv.width=cv.clientWidth*2,h=cv.height=52;
  const ys=vals.filter(v=>v!=null); if(ys.length<2)return;
  const lo=Math.min(...ys),hi=Math.max(...ys),rng=(hi-lo)||1,st=w/(ys.length-1);
  ctx.clearRect(0,0,w,h);ctx.beginPath();ctx.lineWidth=3;ctx.strokeStyle=color;
  ys.forEach((v,i)=>{const x=i*st,y=h-4-((v-lo)/rng)*(h-8); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();}
let ITEMS=[];
function render(){
  const favs=FAV.set, list=ITEMS.filter(i=>favs.has(i.item));
  document.getElementById('wcount').textContent=`${list.length}개 관심 품목`;
  document.getElementById('empty').style.display=list.length?'none':'';
  document.getElementById('grid').innerHTML=list.map(i=>`
    <div class="icard" style="cursor:default">
      <div class="name"><a href="/decade/item/${encodeURIComponent(i.item)}">${i.item}</a>
        <button class="star on" data-item="${encodeURIComponent(i.item)}" style="float:right">★</button></div>
      <div class="cat">${i.category}</div>
      <div class="row"><span class="k">${i.decade_label} 누계</span>
        <span><span class="amt">${fmtAbbr(i.decade_cum)}</span>
        <span style="color:${pc(i.decade_yoy)};font-weight:700;margin-left:6px">${fmtPct(i.decade_yoy)}</span></span></div>
      <div class="row"><span class="k"><a href="/monthly/item/${encodeURIComponent(i.item)}" style="color:var(--muted);text-decoration:underline">월간 ${i.month_period} →</a></span>
        <span>${fmtAbbr(i.month_amount)}<span style="color:${pc(i.month_yoy)};margin-left:6px">${fmtPct(i.month_yoy)}</span></span></div>
      <canvas class="sp" data-item="${encodeURIComponent(i.item)}" style="width:100%;height:26px;margin-top:8px"></canvas>
    </div>`).join('');
  const by=Object.fromEntries(list.map(i=>[i.item,i]));
  document.querySelectorAll('canvas.sp').forEach(cv=>{const it=by[decodeURIComponent(cv.dataset.item)];
    spark(cv,it.spark,pc(it.decade_yoy));});
}
document.addEventListener('click', async e=>{
  const b=e.target.closest('.star'); if(!b) return;
  await FAV.toggle(decodeURIComponent(b.dataset.item)); render();
});
Promise.all([fetch('/api/items').then(r=>r.json()), FAV.load()]).then(([d])=>{
  ITEMS=d.items;
  document.getElementById('layerBadge').innerHTML=`순별 잠정 <b>${d.decade_latest}</b> · 월간 <b>${d.month_latest}</b>`
    + (d.company_latest ? ` · 기업별 <b>${d.company_latest}</b>` : '');
  render();
});
</script>
{% endblock %}
