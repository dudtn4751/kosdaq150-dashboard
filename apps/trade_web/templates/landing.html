{% extends "base.html" %}
{% block title %}수출 데이터{% endblock %}
{% block body %}
<div class="hero">
  <h1>수출 데이터</h1>
  <div class="sub">EPIC Finance 기반 · 10일 단위 잠정 + 월별(기업 포함) 두 층위</div>
</div>

<div class="sections" id="sections"></div>

<div class="card" style="margin-top:20px">
  <div class="cardhead"><h2>통합 검색</h2>
    <div class="hint">품목 · 기업 이름으로 찾아 바로 상세로</div></div>
  <input type="search" id="q" placeholder="예: 메모리, MLCC, 삼성전기, 변압기…"
         style="width:100%;font-size:14px;padding:11px 14px">
  <div id="results"></div>
</div>

<style>
  .hero{padding:22px 0 18px}
  .hero h1{font-size:28px;margin:0}
  .hero .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
  .sec{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;
       padding:18px 18px 16px;color:inherit;transition:.15s}
  .sec:hover{border-color:var(--accent);transform:translateY(-2px)}
  .sec .ico{font-size:24px}
  .sec .t{font-size:16px;font-weight:700;margin-top:8px}
  .sec .d{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
  .sec .v{font-size:19px;font-weight:700;margin-top:12px}
  .sec .vs{font-size:11px;color:var(--muted);margin-top:2px}
  .rrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
  .rrow:last-child{border-bottom:none}
  .rtag{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--panel2);
        border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .rname{font-size:13px}.rsub{font-size:11px;color:var(--muted);margin-left:auto;text-align:right}
</style>

<script>
const CSS=getComputedStyle(document.documentElement), C=k=>CSS.getPropertyValue(k).trim();
const fmtAbbr=v=>v==null?"—":(Math.abs(v)>=1e9?"$"+(v/1e9).toFixed(1)+"B":Math.abs(v)>=1e6?"$"+(v/1e6).toFixed(1)+"M":Math.abs(v)>=1e3?"$"+(v/1e3).toFixed(1)+"K":"$"+v.toFixed(0));
const fmtPct=v=>v==null?"—":(v>=0?"+":"")+v.toFixed(1)+"%";
const pc=v=>v==null?C('--muted'):(v>=0?C('--up'):C('--down'));
let ITEMS=[], COMPANIES=[];

const sec=(href,ico,title,desc,val,vsub)=>`
  <a class="sec" href="${href}"><div class="ico">${ico}</div>
    <div class="t">${title}</div><div class="d">${desc}</div>
    <div class="v">${val}</div><div class="vs">${vsub||'&nbsp;'}</div></a>`;

function search(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const box=document.getElementById('results');
  if(!q){ box.innerHTML=''; return; }
  const it=ITEMS.filter(i=>i.item.toLowerCase().includes(q)).slice(0,8);
  const co=COMPANIES.filter(c=>c.company.toLowerCase().includes(q)
    || c.items.some(x=>x.toLowerCase().includes(q))).slice(0,8);
  if(!it.length && !co.length){ box.innerHTML='<div class="caption" style="padding:12px 4px">일치하는 품목·기업이 없습니다.</div>'; return; }
  box.innerHTML='<div style="margin-top:12px">'
    + it.map(i=>`<a class="rrow" href="/monthly/item/${encodeURIComponent(i.item)}">
        <span class="rtag">품목</span><span class="rname">${i.item}</span>
        <span class="rsub">월간 ${i.month_period} ${fmtAbbr(i.month_amount)}
          <span style="color:${pc(i.month_yoy)}">${fmtPct(i.month_yoy)}</span>
          · <a href="/decade/item/${encodeURIComponent(i.item)}" style="color:var(--accent)">10일 단위 →</a></span></a>`).join('')
    + co.map(c=>`<a class="rrow" href="/monthly/company/${encodeURIComponent(c.company)}">
        <span class="rtag">기업</span><span class="rname">${c.company}</span>
        <span class="rsub">${c.items_short.join(' · ')} · ${c.latest_period} ${fmtAbbr(c.latest_amount)}
          <span style="color:${pc(c.yoy)}">${fmtPct(c.yoy)}</span></span></a>`).join('')
    + '</div>';
}

Promise.all([
  fetch('/api/items').then(r=>r.json()),
  fetch('/api/company_cards').then(r=>r.json()),
  fetch('/api/signal').then(r=>r.json()),
  FAV.load(),
]).then(([items, comps, sig])=>{
  ITEMS=items.items; COMPANIES=comps.cards;
  document.getElementById('layerBadge').innerHTML=
    `10일 단위 <b>${items.decade_latest}</b> · 월별 <b>${items.month_latest}</b>`
    + (items.company_latest?` · 기업별 <b>${items.company_latest}</b>`:'');
  const top1=sig.items[0];
  document.getElementById('sections').innerHTML=[
    sec('/decade','🗓','10일 단위','품목별 잠정 수출 속보 (1·11·21일 갱신)',
        items.decade_latest, `최신 스냅샷 · ${items.count}개 품목`),
    sec('/monthly','🏢','월간 (기업)','기업별 수출 팔로우업 (매월 1일 갱신)',
        items.month_latest, `최신월 · 기업 ${comps.count}개`),
    sec('/signal','📶','시그널','품목 모멘텀 스코어 랭킹',
        top1? `${top1.item}` : '—',
        top1? `Top 1 · Score ${top1.score.toFixed(1)} · ${top1.tag||''}` : ''),
    sec('/watchlist','⭐','Watchlist','관심 품목 모아보기',
        `${FAV.set.size}개`, FAV.set.size? '☆로 추가·해제' : '아직 없음 — ☆를 눌러 추가'),
  ].join('');
});
document.getElementById('q').addEventListener('input', search);
</script>
{% endblock %}
