{% extends "base.html" %}
{% block title %}월간 품목·기업 테이블{% endblock %}
{% block body %}
<div class="top"><h1>📅 월간 · 품목/기업 리스트</h1>
  <span style="flex:1"></span>
  <a class="badge" href="/monthly">카드 보기 →</a>
</div>
<div class="meta" id="meta">불러오는 중…</div>

<div class="toolbar">
  <div id="cats" style="display:flex;flex-wrap:wrap;gap:6px"></div>
  <span style="flex:1"></span>
  <input type="search" id="q" placeholder="품목·기업 검색…" style="width:200px">
  <button class="pill" id="expAll">전체 펼치기</button>
  <button class="pill" id="colAll">전체 접기</button>
</div>

<div class="card" style="padding:0;overflow:auto">
  <table id="tbl" class="mtable">
    <thead>
      <tr class="grp">
        <th rowspan="2" class="lft sortable" data-k="item">품목 / 기업</th>
        <th colspan="5" class="gA">수출 금액 (달러)</th>
        <th colspan="5" class="gB">수출 단가 (달러/kg)</th>
      </tr>
      <tr class="sub">
        <th class="gA sortable" data-k="amt_cur"    id="hA1"></th>
        <th class="gA sortable" data-k="amt_prev_y" id="hA2"></th>
        <th class="gA sortable" data-k="amt_yoy">YoY</th>
        <th class="gA sortable" data-k="amt_m1"     id="hA3"></th>
        <th class="gA sortable" data-k="amt_m2"     id="hA4"></th>
        <th class="gB sortable" data-k="price_cur"    id="hB1"></th>
        <th class="gB sortable" data-k="price_prev_y" id="hB2"></th>
        <th class="gB sortable" data-k="price_yoy">YoY</th>
        <th class="gB sortable" data-k="price_m1"     id="hB3"></th>
        <th class="gB sortable" data-k="price_m2"     id="hB4"></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<style>
  .mtable{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
  .mtable th,.mtable td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}
  .mtable thead th{position:sticky;top:0;background:var(--panel2);color:var(--muted);
                   font-weight:600;font-size:11.5px;z-index:2}
  .mtable thead tr.grp th{text-align:center;border-bottom:1px solid var(--line)}
  .mtable th.gA{background:#101c31}.mtable th.gB{background:#0f1b28}
  .mtable td.gA{background:rgba(79,142,255,.045)}.mtable td.gB{background:rgba(167,139,250,.045)}
  .mtable .lft{text-align:left}
  .mtable th.sortable{cursor:pointer;user-select:none}
  .mtable th.sortable:hover{color:var(--text)}
  .mtable tr.item td{font-weight:700}
  .mtable tr.item:hover td{background:rgba(255,255,255,.03)}
  .mtable tr.comp td{font-weight:400;color:var(--muted);font-size:12px}
  .mtable tr.comp td.lft{padding-left:30px}
  .caret{display:inline-block;width:14px;color:var(--muted)}
  .idx{display:inline-block;min-width:16px;color:#5c6b86;font-size:10.5px}
  .mtable a{color:var(--text)}.mtable a:hover{color:var(--accent)}
</style>

<script>
const CSS=getComputedStyle(document.documentElement), C=k=>CSS.getPropertyValue(k).trim();
const fmtInt=v=>v==null?"—":Math.round(v).toLocaleString();
const fmtPrice=v=>v==null?"—":v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct=v=>v==null?"—":(v>=0?"+":"")+v.toFixed(1)+"%";
const pc=v=>v==null?C('--muted'):(v>=0?C('--up'):C('--down'));
const LSK='trade_monthly_open';
let D=null, cat='전체', sortK='amt_yoy', sortDir=-1;
let open=new Set(JSON.parse(localStorage.getItem(LSK)||'[]'));
const saveOpen=()=>localStorage.setItem(LSK, JSON.stringify([...open]));

function rowHtml(r){
  const has=r.companies.length>0, isOpen=open.has(r.item);
  const cells=k=>`
    <td class="gA">${fmtInt(r['amt_'+k])}</td>`;
  return `<tr class="item" data-item="${encodeURIComponent(r.item)}">
    <td class="lft"><span class="caret">${has?(isOpen?'▾':'▸'):''}</span>
      <a href="/monthly/item/${encodeURIComponent(r.item)}">${r.item}</a></td>
    <td class="gA">${fmtInt(r.amt_cur)}</td><td class="gA">${fmtInt(r.amt_prev_y)}</td>
    <td class="gA" style="color:${pc(r.amt_yoy)};font-weight:700">${fmtPct(r.amt_yoy)}</td>
    <td class="gA">${fmtInt(r.amt_m1)}</td><td class="gA">${fmtInt(r.amt_m2)}</td>
    <td class="gB">${fmtPrice(r.price_cur)}</td><td class="gB">${fmtPrice(r.price_prev_y)}</td>
    <td class="gB" style="color:${pc(r.price_yoy)};font-weight:700">${fmtPct(r.price_yoy)}</td>
    <td class="gB">${fmtPrice(r.price_m1)}</td><td class="gB">${fmtPrice(r.price_m2)}</td>
  </tr>` + (isOpen ? r.companies.map((c,i)=>`
    <tr class="comp">
      <td class="lft"><span class="idx">${i+1}</span>
        <a href="/monthly/item/${encodeURIComponent(r.item)}#companies">${c.company}</a></td>
      <td class="gA">${fmtInt(c.amt_cur)}</td><td class="gA">${fmtInt(c.amt_prev_y)}</td>
      <td class="gA" style="color:${pc(c.amt_yoy)}">${fmtPct(c.amt_yoy)}</td>
      <td class="gA">${fmtInt(c.amt_m1)}</td><td class="gA">${fmtInt(c.amt_m2)}</td>
      <td class="gB">${fmtPrice(c.price_cur)}</td><td class="gB">${fmtPrice(c.price_prev_y)}</td>
      <td class="gB" style="color:${pc(c.price_yoy)}">${fmtPct(c.price_yoy)}</td>
      <td class="gB">${fmtPrice(c.price_m1)}</td><td class="gB">${fmtPrice(c.price_m2)}</td>
    </tr>`).join('') : '');
}

function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  let list=D.rows.filter(r=>(cat==='전체'||r.category===cat) &&
    (!q || r.item.toLowerCase().includes(q) || r.companies.some(c=>c.company.toLowerCase().includes(q))));
  list.sort(sortK==='item' ? (a,b)=>sortDir*a.item.localeCompare(b.item)
    : (a,b)=>sortDir*(((b[sortK]??-1e18))-((a[sortK]??-1e18)))*-1*-1);
  if(sortK!=='item') list.sort((a,b)=>sortDir*(((a[sortK]??-1e18))-((b[sortK]??-1e18))));
  document.querySelector('#tbl tbody').innerHTML=list.map(rowHtml).join('');
  document.getElementById('meta').innerHTML=
    `${list.length}개 품목 · 기업별 보유 ${D.company_item_count}품목 · 기준 <b>${D.labels.cur}</b> (월별) ·
     품목명 클릭 → 상세, 기업명 클릭 → 상세의 기업별 섹션`;
}

fetch('/api/monthly_table').then(r=>r.json()).then(d=>{
  D=d;
  hA1.textContent=d.labels.cur; hA2.textContent=d.labels.prev_y;
  hA3.textContent=d.labels.m1;  hA4.textContent=d.labels.m2;
  hB1.textContent=d.labels.cur; hB2.textContent=d.labels.prev_y;
  hB3.textContent=d.labels.m1;  hB4.textContent=d.labels.m2;
  document.getElementById('layerBadge').innerHTML=`월별 <b>${d.labels.cur}</b>`;
  document.getElementById('cats').innerHTML=['전체',...d.categories].map(c=>
    `<button class="pill${c==='전체'?' on':''}" data-c="${c}">${c}</button>`).join('');
  render();
});

document.getElementById('cats').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  cat=b.dataset.c; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); render();});
document.getElementById('q').addEventListener('input',render);
document.querySelector('#tbl thead').addEventListener('click',e=>{
  const th=e.target.closest('th.sortable'); if(!th) return;
  const k=th.dataset.k; sortDir = (k===sortK) ? -sortDir : (k==='item'?1:-1); sortK=k; render();});
document.querySelector('#tbl tbody').addEventListener('click',e=>{
  if(e.target.closest('a')) return;                 // 링크 클릭은 이동
  const tr=e.target.closest('tr.item'); if(!tr) return;
  const it=decodeURIComponent(tr.dataset.item);
  const row=D.rows.find(r=>r.item===it); if(!row||!row.companies.length) return;
  open.has(it)?open.delete(it):open.add(it); saveOpen(); render();});
document.getElementById('expAll').onclick=()=>{
  D.rows.filter(r=>r.companies.length).forEach(r=>open.add(r.item)); saveOpen(); render();};
document.getElementById('colAll').onclick=()=>{open.clear(); saveOpen(); render();};
</script>
{% endblock %}
