name: keepalive

# Render 무료 플랜은 유휴 시 인스턴스를 재운다. 깨어 있는 동안은
#   · 팀원이 텔레그램 링크를 눌렀을 때 콜드스타트 30초~1분을 기다리지 않고
#   · 신선도 모니터(check_data_freshness.py)가 슬립을 장애로 오인하지 않는다.
# 10분 간격으로 /healthz만 두드린다 — 응답은 버리고 실패도 무시한다.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:        # 수동 트리거(검증용)

permissions:
  contents: read            # 아무것도 쓰지 않는다

concurrency:                # 지연 누적 시 중복 실행 방지
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: |
          URL="https://trade-web-eize.onrender.com/healthz"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 60 --retry 1 --retry-delay 10 "$URL" || echo "000")
          echo "healthz HTTP $CODE"
          # 실패해도 워크플로는 성공 처리 — 깨우는 게 목적이지 감시가 아니다.
          # (진짜 정체·장애 감지는 check_data_freshness.py가 담당)
          exit 0
